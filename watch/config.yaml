# cutchain watch configuration. CLI flags override anything here.

twitch:
  channels:
    - clavicular
    - xqc
  # irc_url: wss://irc-ws.chat.twitch.tv:443   # override only for testing

kick:
  channels:
    - adinross
  # Kick's channel API is often behind Cloudflare. If the automatic lookup
  # fails, put the chatroom id here (find it in the browser: Network tab ->
  # kick.com/api/v2/channels/<slug> -> "chatroom": {"id": ...}).
  chatroom_ids: {}
  #   adinross: 123456

thresholds:
  min_rate: 12          # messages per 10 s that always count as a spike
  spike_factor: 3.0     # ... or rate >= spike_factor * 5-minute baseline
  clip_threshold: 5     # "clip"/"clip it"/"clipped"/"clipper" messages in 30 s
  cooldown_s: 120       # per channel, after a moment fires
  warmup_s: 30          # seconds of history required before a channel can fire
  rate_window_s: 10
  hot_window_s: 30
  baseline_tau_s: 300

api:
  host: 0.0.0.0
  port: 8787

data_dir: data          # relative to the watch/ directory
status_every: 1         # console status line every N seconds per channel
log_level: INFO
